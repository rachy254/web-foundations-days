<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <main>
      <h1>User Directory</h1>
      <p>Browse and filter users from the JSONPlaceholder API.</p>

      <button id="load-users" type="button">Load users</button>

      <div>
        <label for="filter-input">Filter by name</label>
        <input id="filter-input" type="search" autocomplete="off" />
      </div>

      <p id="status" role="status" aria-live="polite">Select “Load users” to get started.</p>
      <ul id="users-list" aria-label="Users"></ul>
    </main>
  </body>
</html>
